name: Deploy Visatrip Global to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund --legacy-peer-deps
          else
            npm install --no-audit --no-fund --legacy-peer-deps
          fi

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Resolve GitHub Pages base path and site URL
        id: pages-meta
        shell: bash
        env:
          CUSTOM_DOMAIN: ${{ vars.CUSTOM_DOMAIN }}
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          PAGES_ORIGIN: ${{ steps.pages.outputs.origin }}
          REPO_NAME: ${{ github.event.repository.name }}
          REPO_OWNER: ${{ github.repository_owner }}
        run: |
          DOMAIN="${CUSTOM_DOMAIN}"
          if [ -z "$DOMAIN" ] && [ -f "CNAME" ]; then
            DOMAIN="$(tr -d ' \t\r\n' < CNAME)"
          fi

          if [ -n "$DOMAIN" ]; then
            echo "base_path=/" >> "$GITHUB_OUTPUT"
            echo "site_url=https://${DOMAIN}" >> "$GITHUB_OUTPUT"
            echo "cname=${DOMAIN}" >> "$GITHUB_OUTPUT"
          elif [ -n "$PAGES_ORIGIN" ]; then
            if [ -z "$PAGES_BASE_PATH" ] || [ "$PAGES_BASE_PATH" = "/" ]; then
              echo "base_path=/" >> "$GITHUB_OUTPUT"
              echo "site_url=${PAGES_ORIGIN}" >> "$GITHUB_OUTPUT"
            else
              CLEAN_BASE="/$(echo "$PAGES_BASE_PATH" | sed 's#^/*##; s#/*$##')/"
              echo "base_path=${CLEAN_BASE}" >> "$GITHUB_OUTPUT"
              echo "site_url=${PAGES_ORIGIN}${CLEAN_BASE%/}" >> "$GITHUB_OUTPUT"
            fi
            echo "cname=" >> "$GITHUB_OUTPUT"
          elif [ "${REPO_NAME,,}" = "${REPO_OWNER,,}.github.io" ]; then
            echo "base_path=/" >> "$GITHUB_OUTPUT"
            echo "site_url=https://${REPO_OWNER}.github.io" >> "$GITHUB_OUTPUT"
            echo "cname=" >> "$GITHUB_OUTPUT"
          else
            echo "base_path=/${REPO_NAME}/" >> "$GITHUB_OUTPUT"
            echo "site_url=https://${REPO_OWNER}.github.io/${REPO_NAME}" >> "$GITHUB_OUTPUT"
            echo "cname=" >> "$GITHUB_OUTPUT"
          fi

      - name: Build static site for GitHub Pages
        env:
          VITE_BASE_PATH: ${{ steps.pages-meta.outputs.base_path }}
          VITE_SITE_URL: ${{ steps.pages-meta.outputs.site_url }}
          GH_PAGES_CNAME: ${{ steps.pages-meta.outputs.cname }}
          VITE_STATIC_SITE: "true"
          VITE_WHATSAPP_NUMBER: ${{ vars.VITE_WHATSAPP_NUMBER }}
          VITE_GA4_MEASUREMENT_ID: ${{ vars.VITE_GA4_MEASUREMENT_ID }}
          VITE_META_PIXEL_ID: ${{ vars.VITE_META_PIXEL_ID }}
          VITE_GSC_VERIFICATION: ${{ vars.VITE_GSC_VERIFICATION }}
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          VITE_FORM_ENDPOINT: ${{ vars.VITE_FORM_ENDPOINT }}
        run: npm run build:gh-pages

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
